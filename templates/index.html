<!DOCTYPE html>
<html>
<head><title>S3 Uploader</title></head>
<body>
    <h1>Upload to S3</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <input type="submit" value="Upload">
    </form>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
